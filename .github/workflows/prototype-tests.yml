name: Prototype tests
on:
  push:
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-tests.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify deterministic simulation and checkpoints
        working-directory: prototype
        run: python -m unittest discover -s tests -v
